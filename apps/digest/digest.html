<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Digest</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121922;
      --line: #283544;
      --text: #edf3f8;
      --muted: #91a0ad;
      --accent: #5ee0a0;
      --warn: #ffcf66;
      --blue: #74b9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #152033, var(--bg) 55%);
      color: var(--text);
      font: 14px/1.4 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    .app { width: min(980px, 100%); margin: 0 auto; padding: 20px; }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 700;
    }
    h1 { margin: 4px 0 0; font-size: 34px; letter-spacing: -.03em; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #18212c;
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #062316;
      border-color: transparent;
      font-weight: 700;
    }
    button.tiny {
      padding: 4px 8px;
      font-size: 12px;
      margin-top: 8px;
      margin-right: 6px;
    }
    .bridge {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 960px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    section {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      min-height: 280px;
    }
    section.watching .item { opacity: 0.72; }
    section h2 {
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .list { padding: 8px 14px 14px; }
    .item {
      padding: 10px 0;
      border-bottom: 1px solid #202c38;
    }
    .item:last-child { border-bottom: 0; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .empty { color: var(--muted); padding: 18px 0; }
    .status { color: var(--muted); margin-top: 14px; font-size: 12px; }
    a { color: var(--blue); }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: start; }
      .bridge { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" hidden>
    <header>
      <div>
        <div class="eyebrow">Daily card</div>
        <h1>Digest</h1>
      </div>
      <div class="actions">
        <div class="bridge">
          <div id="bridge-label">Shelf</div>
          <div id="bridge-detail">Rules-assembled · offline-first</div>
        </div>
        <button type="button" id="refresh">Refresh</button>
        <button type="button" class="primary" id="ai-propose">Propose nudges</button>
      </div>
    </header>

    <div class="grid">
      <section>
        <h2>Today</h2>
        <div class="list" id="today"></div>
      </section>
      <section class="watching">
        <h2>Watching</h2>
        <div class="list" id="watching"></div>
      </section>
      <section>
        <h2>Reading</h2>
        <div class="list" id="reading"></div>
      </section>
      <section>
        <h2>Junk</h2>
        <div class="list" id="junk"></div>
      </section>
    </div>
    <p class="status" id="status">Loading…</p>
  </main>
  <p class="status" id="boot-error" hidden style="margin:40px auto;width:min(520px,90%)"></p>

  <script src="../shelf/hub-shelf.js"></script>
  <script src="../shelf/mock-shelf.js"></script>
  <script>
    "use strict";

    function escapeHtml(value) {
      const el = document.createElement("span");
      el.textContent = value == null ? "" : String(value);
      return el.innerHTML;
    }

    function actionId(prefix) {
      const suffix = globalThis.crypto?.randomUUID
        ? globalThis.crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      return `${prefix}:${suffix}`;
    }

    function renderItems(selector, items, mapper, emptyText) {
      const root = document.querySelector(selector);
      if (!items.length) {
        root.innerHTML = `<div class="empty">${emptyText}</div>`;
        return;
      }
      root.innerHTML = items.map(mapper).join("");
    }

    function actionButtons(actions) {
      if (!actions || !actions.length) return "";
      const labels = {
        "import.statement": "Open Money to import",
        "task.complete": "Done",
        "calendar.add": "Add to calendar",
        "rsvp.yes": "Going",
        "rsvp.no": "Not going",
        "bill.paid": "Paid",
        dismiss: "Dismiss",
        ack: "Ack",
        rsvp: "RSVP",
        unsubscribe: "Unsubscribe"
      };
      return actions
        .map((action) => {
          const label = labels[action.type] || action.type;
          const href = action.targetRef?.href;
          if (action.type === "import.statement" && href) {
            return (
              `<a class="tiny digest-action" style="display:inline-block;text-decoration:none" ` +
              `href="${escapeHtml(href)}">${escapeHtml(label)}</a>`
            );
          }
          return (
            `<button type="button" class="tiny digest-action" ` +
            `data-type="${escapeHtml(action.type)}" ` +
            `data-ref="${escapeHtml(JSON.stringify(action.targetRef || {}))}">` +
            `${escapeHtml(label)}</button>`
          );
        })
        .join("");
    }

    async function loadDigest() {
      const digest = await Shelf.data.get("digest");
      if (!digest) {
        document.querySelector("#status").textContent = "No digest synced yet";
        renderItems("#today", [], null, "Nothing for today yet");
        renderItems("#watching", [], null, "Nothing you’re skipping");
        renderItems("#reading", [], null, "No reading links");
        renderItems("#junk", [], null, "No junk actions");
        return;
      }

      renderItems("#today", digest.today || [], (item) => {
        const when = item.dueAt || item.start ||
          (item.month && item.day ? `${item.month}/${item.day}` : "");
        const domain = item.domain ? ` · ${item.domain}` : "";
        const source = item.source ? ` · ${item.source}` : "";
        return `
        <div class="item">
          <strong>${escapeHtml(item.kind)}${escapeHtml(domain)} · ${escapeHtml(item.title || item.name)}</strong>
          <div class="meta">${escapeHtml(when)}${escapeHtml(source)}${item.why ? ` · ${escapeHtml(item.why)}` : ""}</div>
          ${actionButtons(item.actions)}
        </div>`;
      }, "Nothing for today yet");

      renderItems("#watching", digest.watching || [], (item) => {
        const when = item.start || "";
        return `
        <div class="item">
          <strong>not going · ${escapeHtml(item.title || item.name)}</strong>
          <div class="meta">${escapeHtml(when)}${item.source ? ` · ${escapeHtml(item.source)}` : ""} · still on your radar</div>
        </div>`;
      }, "Nothing you’re skipping");

      renderItems("#reading", digest.reading || [], (item) => `
        <div class="item">
          <a href="${escapeHtml(item.url)}" rel="noreferrer">${escapeHtml(item.title || item.url)}</a>
          <div class="meta">${escapeHtml(item.source)} · rank ${escapeHtml(item.rank)}</div>
        </div>`, "No reading links");

      renderItems("#junk", digest.junk || [], (item) => `
        <div class="item">
          <strong>${escapeHtml(item.action)}</strong>
          <div class="meta">${escapeHtml(item.status || "pending")}</div>
          ${
            item.status === "pending"
              ? `<button type="button" class="tiny digest-action" data-type="unsubscribe" data-ref="${escapeHtml(JSON.stringify(item.targetRef || { itemId: item.id }))}">run</button>`
              : ""
          }
        </div>`, "No junk actions");

      document.querySelector("#status").textContent =
        `Updated ${digest.generatedAt || "now"} · as of ${digest.asOfDate || "—"} · ` +
        `${(digest.today || []).length} today · ` +
        `${(digest.watching || []).length} watching · ` +
        `${(digest.reading || []).length} reading · ` +
        `${(digest.junk || []).length} junk`;
    }

    document.querySelector("#refresh").addEventListener("click", () => {
      loadDigest().catch((error) => {
        document.querySelector("#status").textContent = error.message;
      });
    });

    document.querySelector("#ai-propose").addEventListener("click", async () => {
      const status = document.querySelector("#status");
      if (!Shelf.ai || typeof Shelf.ai.propose !== "function") {
        status.textContent = "AI is not available on this bridge";
        return;
      }
      try {
        await Shelf.ai.setMode("LOCAL");
        const result = await Shelf.ai.propose();
        if (result.mode === "OFF") {
          status.textContent = "AI is OFF";
        } else {
          status.textContent =
            `AI ${result.mode}: ${(result.proposal?.flags || []).length} nudge(s); records not mutated`;
        }
        await loadDigest();
      } catch (error) {
        status.textContent = error.message || String(error);
      }
    });

    document.querySelector(".grid").addEventListener("click", async (event) => {
      const button = event.target.closest(".digest-action");
      if (!button) return;
      const type = button.dataset.type;
      let targetRef = {};
      try {
        targetRef = JSON.parse(button.dataset.ref || "{}");
      } catch (_error) {
        targetRef = {};
      }
      button.disabled = true;
      try {
        await Shelf.outbox.push({
          id: actionId(`digest:${type}`),
          type: type.startsWith("action.") ? type : `action.${type}`,
          source: "digest",
          collectedAt: new Date().toISOString(),
          data: { targetRef }
        });
        await loadDigest();
      } catch (error) {
        document.querySelector("#status").textContent = error.message || String(error);
        button.disabled = false;
      }
    });

    async function boot() {
      if (!window.Shelf || typeof Shelf.data?.get !== "function") {
        throw new Error("window.Shelf is missing");
      }
      document.querySelector("#bridge-label").textContent = Shelf.__hub
        ? "Shelf (hub relay)"
        : Shelf.__real
          ? "Shelf (device)"
          : "Shelf (mock)";
      document.querySelector("#bridge-detail").textContent = Shelf.__hub
        ? "Assembled on hub · outbox actions"
        : Shelf.__real
          ? "Native bridge · no page network"
          : "Local stub · no page network";
      document.querySelector("#app").hidden = false;
      await loadDigest();
    }

    boot().catch((error) => {
      const box = document.querySelector("#boot-error");
      box.hidden = false;
      box.textContent = `Digest failed to start: ${error.message || error}`;
    });
  </script>
</body>
</html>
